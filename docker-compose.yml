services:
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    # Bound to localhost by default: only this machine can reach the API.
    # To expose it on your network/internet, bind wider here AND set API_KEY
    # below explicitly (otherwise a fresh key is generated per container).
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - API_KEY=${API_KEY:-}
      - API_HOST=0.0.0.0 # safe: still only published to 127.0.0.1 above
      - WEB_ORIGIN=${WEB_ORIGIN:-http://localhost:3000}
      - DATA_DIR=/app/data
      # Leave unset unless you put your own trusted reverse proxy in front of
      # the web service (see README > Security defaults) — otherwise a caller
      # could forge X-Forwarded-For to dodge the /api/ai rate limit.
      - TRUST_PROXY=${TRUST_PROXY:-}
      # OpenBB is tried first for quotes/history and powers the Fundamentals
      # widget; if it's down, everything falls back to the free providers.
      # Set OPENBB_URL= (empty) to switch the integration off.
      - OPENBB_URL=${OPENBB_URL-http://openbb:6900}
      - OPENBB_PROVIDER=${OPENBB_PROVIDER:-yfinance}
    volumes:
      - terminal-data:/app/data
    depends_on:
      - openbb
    restart: unless-stopped

  openbb:
    build:
      context: openbb
      args:
        - OPENBB_EXTRAS=${OPENBB_EXTRAS:-}
    # Not published to the host: only the api service talks to it.
    expose:
      - "6900"
    volumes:
      - openbb-settings:/root/.openbb_platform
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - API_URL=http://api:4000
      - API_KEY=${API_KEY:-}
      - API_KEY_FILE=/app/data/.api-key
    volumes:
      - terminal-data:/app/data:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  terminal-data:
  openbb-settings:
